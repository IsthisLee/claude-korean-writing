<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif">
  <rect width="1280" height="640" fill="#1e2229"/>

  <text x="72" y="118" font-size="62" font-weight="700" fill="#f4f6f8" font-family="SF Mono, Menlo, Consolas, monospace">korean-writing</text>
  <text x="72" y="166" font-size="27" fill="#aab3bf">Claude Code가 쓰는 모든 한국어가 사람이 쓴 것처럼 나옵니다</text>

  <rect x="72" y="212" width="1136" height="228" rx="14" fill="#171b21" stroke="#2c323b" stroke-width="1"/>

  <text x="108" y="278" font-size="26" fill="#ff6b6b" font-family="SF Mono, Menlo, Consolas, monospace">✗</text>
  <text x="148" y="278" font-size="26" fill="#8b95a1">점검 장치가 장비를 계속 넘어뜨리고 있었습니다</text>

  <text x="108" y="342" font-size="26" fill="#51cf66" font-family="SF Mono, Menlo, Consolas, monospace">✓</text>
  <text x="148" y="342" font-size="26" fill="#f4f6f8">점검 장치 때문에 장비가 계속 멈췄습니다</text>

  <text x="108" y="402" font-size="19" fill="#6b7684">문법은 맞습니다. 다만 사람이 한국어로 쓸 때는 나오지 않는 표현입니다.</text>

  <rect x="72" y="482" width="150" height="40" rx="20" fill="#2c323b"/><text x="147" y="508" text-anchor="middle" font-size="17" fill="#ffd166">평소 답변</text>
  <rect x="234" y="482" width="180" height="40" rx="20" fill="#2c323b"/><text x="324" y="508" text-anchor="middle" font-size="17" fill="#ffd166">새로 쓰는 글</text>
  <rect x="426" y="482" width="166" height="40" rx="20" fill="#2c323b"/><text x="509" y="508" text-anchor="middle" font-size="17" fill="#ffd166">이미 쓴 글</text>
  <rect x="604" y="482" width="196" height="40" rx="20" fill="#2c323b"/><text x="702" y="508" text-anchor="middle" font-size="17" fill="#ffd166">저장하는 .md</text>

  <text x="72" y="580" font-size="20" fill="#aab3bf" font-family="SF Mono, Menlo, Consolas, monospace">claude plugin install korean-writing</text>
  <text x="1208" y="580" text-anchor="end" font-size="18" fill="#6b7684">MIT · 외부 전송 없음 · macOS | Linux</text>
</svg>
