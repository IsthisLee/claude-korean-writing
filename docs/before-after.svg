<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="902" viewBox="0 0 1200 902" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="1200" height="902" rx="12" fill="#1e2229"/>
<text x="28" y="54" fill="#f2f4f7" font-size="22" font-weight="700">같은 요청, 두 결과</text>
<text x="28" y="82" fill="#9aa4b2" font-size="14">요청: 사내 개발팀에 보낼 공지를 써 줘. 다음 주부터 배포 승인 절차가 바뀐다. 승인자가 두 명에서 한 명으로 줄고, 대신 배포 전에 체크리스트를 반드시 돌려야 한다. 400자 정도.</text>
<rect x="28" y="104" width="560" height="640" rx="10" fill="#262b33"/>
<text x="48" y="136" fill="#f2f4f7" font-size="17" font-weight="700">플러그인 없이 쓰고 다 쓴 뒤 윤문</text>
<text x="48" y="160" fill="#ff8fa3" font-size="13">im-not-ai 윤문 변경률 0.0% · 윤문 전과 한 글자도 같다</text>
<line x1="48" y1="172" x2="568" y2="172" stroke="#39404b"/>
<text x="48" y="196" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">**[공지] 다음 주부터 배포 승인 절차가 바뀝니다**</tspan></text>
<text x="48" y="238" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">안녕하세요, 개발팀 여러분.</tspan></text>
<text x="48" y="280" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">다음 주 [O월 O일(월)]부터 배포 승인 절차가 바뀝니다. 바뀌는 점은 두</tspan></text>
<text x="48" y="301" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">가지입니다.</tspan></text>
<text x="48" y="343" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">1. **승인자가 두 명에서 한 명으로 줄어듭니다.**</tspan><tspan fill="#d7dde5"> 이제 한 명만 승인해도</tspan></text>
<text x="48" y="364" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">배포할 수 있습니다.</tspan></text>
<text x="48" y="385" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">2. **대신 배포 전에 체크리스트를 반드시 돌려야 합니다.**</tspan><tspan fill="#d7dde5"> 체크리스트를</tspan></text>
<text x="48" y="406" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">돌리지 않았다면 승인을 받았더라도 배포하지 말아 주세요.</tspan></text>
<text x="48" y="448" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">승인자가 줄어드는 대신 배포 전 점검을 체크리스트로 </tspan><tspan fill="#ff8fa3">챙기려는 것입니다</tspan><tspan fill="#d7dde5">.</tspan></text>
<text x="48" y="490" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">체크리스트는 [위치 또는 링크]에 있습니다. 새 절차가 시작되기 전에 한</tspan></text>
<text x="48" y="511" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">번 훑어봐 두시면 첫 배포 때 덜 헤매실 겁니다.</tspan></text>
<text x="48" y="553" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">궁금한 점은 [담당자 또는 채널]로 물어봐 주세요.</tspan></text>
<text x="48" y="595" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">감사합니다.</tspan></text>
<text x="48" y="637" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">---</tspan></text>
<text x="48" y="679" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">공백을 넣어 400자 안팎입니다. 적용 날짜와 체크리스트 위치, 문의처는</tspan></text>
<text x="48" y="700" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">알려 주신 내용에 없어서 대괄호로 비워 두었습니다. 채워서 보내시면</tspan></text>
<text x="48" y="721" font-size="13.5" xml:space="preserve"><tspan fill="#ff8fa3">됩니다.</tspan></text>
<rect x="612" y="104" width="560" height="451" rx="10" fill="#262b33"/>
<text x="632" y="136" fill="#f2f4f7" font-size="17" font-weight="700">korean-writing 스킬로 처음부터</text>
<text x="632" y="160" fill="#7ee0a3" font-size="13">블라인드 판정에서 두 순서 모두 이긴 쪽</text>
<line x1="632" y1="172" x2="1152" y2="172" stroke="#39404b"/>
<text x="632" y="196" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">안녕하세요, 개발팀 여러분.</tspan></text>
<text x="632" y="238" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">다음 주부터 배포 승인 절차가 바뀌어 미리 알려 드립니다. 이번 주에</tspan></text>
<text x="632" y="259" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">올려 둔 배포 요청이라도 실제 배포가 다음 주라면 바뀐 절차를 따라</tspan></text>
<text x="632" y="280" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">주세요.</tspan></text>
<text x="632" y="322" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">지금은 배포 한 건마다 승인자 두 명에게 승인을 받아야 하는데 다음</tspan></text>
<text x="632" y="343" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">주부터는 한 명만 승인하면 됩니다. 대신 배포 전에 체크리스트를 반드시</tspan></text>
<text x="632" y="364" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">돌려야 합니다. 승인자가 한 명 줄어든 만큼 그 사람이 보던 부분을</tspan></text>
<text x="632" y="385" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">체크리스트로 확인하는 셈이니 급한 배포라도 건너뛰지 말아 주세요.</tspan></text>
<text x="632" y="406" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">승인하시는 분도 체크리스트를 돌렸는지 먼저 확인한 뒤 승인해 주시기</tspan></text>
<text x="632" y="427" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">바랍니다.</tspan></text>
<text x="632" y="469" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">체크리스트는 [링크]에 있습니다. 항목이나 절차가 헷갈리면 [담당자]에게</tspan></text>
<text x="632" y="490" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">편하게 물어봐 주세요.</tspan></text>
<text x="632" y="532" font-size="13.5" xml:space="preserve"><tspan fill="#d7dde5">감사합니다.</tspan></text>
<text x="28" y="782" fill="#9aa4b2" font-size="13" font-weight="700">빨간 글씨</text>
<text x="112" y="782" fill="#9aa4b2" font-size="13" xml:space="preserve">판정자가 짚은 굵은 글씨·번호 목록·형식명사 끝맺음, 그리고 스킬의 「요청한 글만 낸다」 규칙이 막는 본문 뒤 안내</text>
<text x="28" y="811" fill="#9aa4b2" font-size="13" font-weight="700">판정자</text>
<text x="112" y="811" fill="#9aa4b2" font-size="13" xml:space="preserve">글 1은 사람이 말하듯 문단으로 이어 쓰고, 바뀐 이유와 부탁하는 말도 자연스럽게 녹였다. 글 2는 굵은 글씨를 많이 쓰고 번호 목록으로 나눴으며,</text>
<text x="112" y="832" fill="#9aa4b2" font-size="13" xml:space="preserve">'챙기려는 것입니다'처럼 형식명사로 끝맺어 틀에 맞춰 찍어낸 공지처럼 읽힌다.</text>
<text x="28" y="861" fill="#9aa4b2" font-size="13" font-weight="700">출처</text>
<text x="112" y="861" fill="#9aa4b2" font-size="13" xml:space="preserve">docs/samples/before-after/ · 생성과 판정 claude-opus-5 · 2026-09-11 · 순서를 바꿔 두 번 물었다</text>
</svg>
