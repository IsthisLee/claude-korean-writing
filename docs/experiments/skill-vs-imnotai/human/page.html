<title>어느 글이 더 자연스러운가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root {
  --paper: #f3f5f1;
  --sheet: #fbfcf9;
  --ink: #1d2320;
  --ink-soft: #55615a;
  --rule: #d6ddd6;
  --grid: #2f6b4f;
  --grid-soft: #e3eee7;
  --focus: #1f5a8a;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131815; --sheet: #1a201c; --ink: #e2e8e3; --ink-soft: #9aa69e;
    --rule: #2c3530; --grid: #7fc3a0; --grid-soft: #22302a; --focus: #8cc4f0;
  }
}
:root[data-theme="dark"] {
  --paper: #131815; --sheet: #1a201c; --ink: #e2e8e3; --ink-soft: #9aa69e;
  --rule: #2c3530; --grid: #7fc3a0; --grid-soft: #22302a; --focus: #8cc4f0;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 var(--sans); padding-inline: 20px; padding-block: 28px 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { margin: 0; font: 600 24px/1.3 var(--sans); letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--ink-soft); max-width: 62ch; }
.meta { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-soft); }
.count { font: 500 14px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--grid); width: 0; transition: width .25s ease; }
label.nick { display: flex; align-items: center; gap: 8px; }
label.nick input { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; width: 9em; }
.request { font-size: 14px; color: var(--ink-soft); }
.request b { color: var(--ink); font-weight: 500; }
.sheets { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sheet {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px;
  padding: 22px 26px 26px 34px; position: relative; min-width: 0;
}
/* 원고지 가장자리: 왼쪽 여백선 두 줄 */
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 18px; border-left: 1px solid var(--grid-soft); border-right: 1px solid var(--grid-soft); width: 4px; }
.sheet h2 { margin: 0 0 12px; font: 600 13px var(--sans); letter-spacing: .08em; color: var(--grid); }
.text { font: 400 16.5px/1.95 var(--serif); max-width: 36em; overflow-wrap: anywhere; }
.text p { margin: 0 0 .9em; }
.text h3 { font: 600 17px/1.6 var(--serif); margin: 0 0 .6em; }
.text ul, .text ol { margin: 0 0 .9em; padding-left: 1.3em; }
.choices { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.choices button {
  font: 500 15px var(--sans); color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; cursor: pointer;
}
.choices button:hover { border-color: var(--grid); }
.choices button[aria-pressed="true"] { background: var(--grid); border-color: var(--grid); color: var(--sheet); }
.choices kbd { font: 500 11px var(--mono); opacity: .7; margin-left: 6px; }
textarea {
  width: 100%; font: 14px/1.6 var(--sans); color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; min-height: 64px; resize: vertical;
}
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.nav button { font: 500 14px var(--sans); background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.nav button:disabled { opacity: .4; cursor: default; }
.status { font-size: 13px; color: var(--ink-soft); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.done { background: var(--grid-soft); border-radius: 6px; padding: 14px 18px; }
@media (max-width: 760px) {
  .sheets { grid-template-columns: 1fr; }
  .choices { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>어느 글이 더 자연스러운가</h1>
      <p class="lede">같은 요청으로 쓴 두 글입니다. 한국어를 모국어로 쓰는 사람이 직접 쓴 글처럼 더 자연스럽게 읽히는 쪽을 골라 주세요. 내용이 맞는지와 길이는 보지 않습니다. 어느 글이 어떤 방법으로 쓰였는지는 알려 드리지 않습니다.</p>
    </div>
    <div class="meta">
      <label class="nick" for="nick">이름 <input id="nick" type="text" placeholder="선택" autocomplete="off"></label>
      <span class="count" id="count">0 / 0</span>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <p class="request" id="request"></p>
  <section class="sheets" aria-label="두 글">
    <article class="sheet"><h2>글 A</h2><div class="text" id="textA"></div></article>
    <article class="sheet"><h2>글 B</h2><div class="text" id="textB"></div></article>
  </section>
  <div class="choices" role="group" aria-label="고르기">
    <button type="button" id="pickA" data-choice="A">글 A가 더 자연스럽다<kbd>1</kbd></button>
    <button type="button" id="pickT" data-choice="tie">비슷하다<kbd>2</kbd></button>
    <button type="button" id="pickB" data-choice="B">글 B가 더 자연스럽다<kbd>3</kbd></button>
  </div>
  <label for="reason" class="status">고른 이유 (선택)</label>
  <textarea id="reason" placeholder="어느 문장이 걸렸는지 적어 주시면 판정 기준을 고치는 데 씁니다"></textarea>
  <div class="nav">
    <button type="button" id="prev">이전 쌍</button>
    <span class="status" id="status" role="status"></span>
    <button type="button" id="next">다음 쌍</button>
  </div>
  <div class="done" id="done" hidden></div>
</div>

<script>
const PAIRS = /*__PAIRS__*/[];
const KEY = "kw-human-eval";
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } })();
if (!store.rater) store.rater = "r" + Math.random().toString(36).slice(2, 10);
store.answers = store.answers || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };
save();

let db = null;
let i = Math.max(0, PAIRS.findIndex(p => !store.answers[p.id]));
if (i === -1 || !PAIRS.length) i = 0;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 마크다운을 가볍게 옮긴다. 두 글에 같은 규칙을 쓴다.
function render(md) {
  const out = []; let list = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.split(/\n/)) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join("");
}

function show() {
  const p = PAIRS[i]; if (!p) return;
  const done = Object.keys(store.answers).filter(k => PAIRS.some(q => q.id === k)).length;
  $("count").textContent = `${i + 1} / ${PAIRS.length}`;
  $("bar").style.width = `${(done / PAIRS.length) * 100}%`;
  $("request").innerHTML = `<b>요청</b> ${esc(p.prompt)}`;
  $("textA").innerHTML = render(p.a);
  $("textB").innerHTML = render(p.b);
  const a = store.answers[p.id] || {};
  for (const b of document.querySelectorAll(".choices button")) b.setAttribute("aria-pressed", String(b.dataset.choice === a.choice));
  $("reason").value = a.reason || "";
  $("prev").disabled = i === 0;
  $("next").textContent = i === PAIRS.length - 1 ? "끝내기" : "다음 쌍";
  $("status").textContent = a.choice ? (a.synced ? "저장했습니다" : (db ? "저장 중" : "이 브라우저에만 저장했습니다")) : `남은 쌍 ${PAIRS.length - done}개`;
  $("done").hidden = done < PAIRS.length;
  if (done >= PAIRS.length) $("done").textContent = `${PAIRS.length}쌍을 모두 평가했습니다. 고마워요. 답은 언제든 다시 고칠 수 있습니다.`;
}

async function record(choice) {
  const p = PAIRS[i];
  const entry = { choice, reason: $("reason").value.trim(), at: new Date().toISOString(), synced: false };
  store.answers[p.id] = entry; save(); show();
  if (!db) return;
  try {
    await db.doc(`ratings/${store.rater}_${p.id}`).set({
      rater: store.rater, nickname: $("nick").value.trim().slice(0, 40), pair: p.id,
      choice, reason: entry.reason.slice(0, 2000), at: entry.at,
    });
    entry.synced = true; save();
  } catch (e) {
    $("status").textContent = "서버에 저장하지 못해 이 브라우저에만 남겼습니다. 다시 고르면 다시 보냅니다.";
    return;
  }
  show();
}

for (const b of document.querySelectorAll(".choices button")) b.addEventListener("click", () => record(b.dataset.choice));
$("reason").addEventListener("change", () => { const a = store.answers[PAIRS[i].id]; if (a) record(a.choice); });
$("prev").addEventListener("click", () => { if (i > 0) { i--; show(); scrollTo({ top: 0 }); } });
$("next").addEventListener("click", () => { if (i < PAIRS.length - 1) { i++; show(); scrollTo({ top: 0 }); } else show(); });
$("nick").value = store.nickname || "";
$("nick").addEventListener("change", () => { store.nickname = $("nick").value.trim(); save(); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const k = { "1": "A", "2": "tie", "3": "B", a: "A", b: "B", t: "tie" }[e.key.toLowerCase()];
  if (k) record(k);
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
});
show();

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  // 저장이 안 된 답을 다시 보낸다
  if (db) for (const p of PAIRS) { const a = store.answers[p.id]; if (a && !a.synced) { const j = i; i = PAIRS.indexOf(p); await record(a.choice); i = j; } }
  show();
})();
</script>
