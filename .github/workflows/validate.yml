name: Validate

# 저장소는 두 층이다. `plugin/` 만 설치한 사람의 기계로 복사되고 나머지는 여기 남는다.
# 이 워크플로는 두 가지를 본다. 설치본이 제대로 도는가, 그리고 설치본에 들어가면
# 안 되는 것이 들어가지 않았는가.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 최소 권한. 이 워크플로는 저장소를 읽기만 하고 아무것도 쓰지 않는다.
# 명시하지 않으면 저장소 기본값이 적용되고, 그 기본값이 쓰기일 수 있다.
permissions:
  contents: read

# 같은 브랜치에 연달아 push 하면 앞선 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    # 이 저장소에서 가장 중요한 검사다. 플러그인 설치는 `source` 가 가리키는 폴더를
    # 통째로 복사하고 빼는 수단이 없다. 여기가 새면 테스트·실험·CI 가 남의 기계로 간다.
    name: 설치본 경계
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: plugin/ 에 들어가면 안 되는 것
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys

          src = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["source"]
          if src != "./plugin":
              print(f"::error file=.claude-plugin/marketplace.json::source 가 {src} 다. ./plugin 이어야 한다")
              sys.exit(1)

          shipped = subprocess.run(["git", "ls-files", "plugin/"],
                                   capture_output=True, text=True, check=True).stdout.split()
          if not shipped:
              print("::error::plugin/ 이 비어 있다"); sys.exit(1)

          # 설치한 사람에게 쓸모가 없거나 있으면 안 되는 것.
          BANNED = [
              ("테스트",       lambda p: pathlib.Path(p).name.startswith("test_")),
              ("실험 산출물",  lambda p: "/experiments/" in p),
              ("CI 설정",      lambda p: p.startswith("plugin/.github/")),
              ("관리자 스크립트", lambda p: pathlib.Path(p).name in
                                  {"release.sh", "measure.sh", "install-git-hook.sh"}),
              ("저장소 문서",  lambda p: pathlib.Path(p).name in
                                  {"CHANGELOG.md", "EVALUATION.md", "CONTRIBUTING.md",
                                   "CONTRIBUTING.en.md", "CODE_OF_CONDUCT.md", "SUPPORT.md",
                                   "SECURITY.md", "CLAUDE.md", "README.en.md"}),
              ("잠금 파일",    lambda p: pathlib.Path(p).name in
                                  {"package-lock.json", "yarn.lock", "pnpm-lock.yaml"}),
          ]
          bad = [(why, p) for p in shipped for why, hit in BANNED if hit(p)]
          for why, p in bad:
              print(f"::error file={p}::{why} 가 설치본에 있다. 저장소 층으로 옮긴다")

          # 라이선스는 배포물에 따라가야 한다.
          for must in ("plugin/LICENSE", "plugin/NOTICE.md", "plugin/.claude-plugin/plugin.json"):
              if must not in shipped:
                  print(f"::error::{must} 가 없다. 설치본에 반드시 있어야 한다")
                  bad.append(("필수 파일 없음", must))

          size = sum(pathlib.Path(p).stat().st_size for p in shipped)
          print(f"설치본 {len(shipped)}개 파일 · {size // 1024}KB")
          repo = subprocess.run(["git", "ls-files"], capture_output=True, text=True,
                                check=True).stdout.split()
          print(f"저장소 전체 {len(repo)}개 — 설치본이 아닌 것 {len(repo) - len(shipped)}개")
          sys.exit(1 if bad else 0)
          PY

      - name: plugin/ 에 추적되지 않는 파일이 있는가
        run: |
          # 플러그인 설치는 작업 트리를 그대로 복사한다. git 이 무시하는 파일도 같이 간다.
          # 실측: 로컬에서 py_compile 을 돌린 뒤 설치하니 __pycache__ 11개가 남의 기계로 갔다.
          # CI 는 깨끗한 체크아웃이라 여기서는 늘 비어 있어야 한다.
          # `??` 는 미추적, `!!` 는 .gitignore 가 무시하는 것이다. 둘 다 설치에는 따라간다.
          out=$(git status --porcelain --ignored plugin/ | grep -E '^(\?\?|!!) ' || true)
          if [ -n "$out" ]; then
            echo "$out" | while read -r line; do echo "::error::설치에 딸려 갈 파일: $line"; done
            exit 1
          fi
          echo "plugin/ 에 미추적·무시 파일 없음"

      - name: 두 LICENSE 가 같은가
        run: |
          # 하나는 GitHub 이 읽고 하나는 배포물에 따라간다. 갈라지면 배포물 쪽이 거짓이 된다.
          diff LICENSE plugin/LICENSE && echo "LICENSE 동일"

  tests:
    # 훅은 bash 와 python3 만 쓴다. 두 OS 에서 돌려 README 의 platform 배지를 실측으로 뒷받침한다.
    name: 회귀 테스트와 문서 자체 검사 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 체크아웃이 남기는 토큰이 .git/config 에 그대로 남는다. 이 워크플로는
          # 아무것도 밀지 않으므로 아예 안 남긴다(zizmor artipacked).
          persist-credentials: false

      - name: 매니페스트 JSON 문법
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f"
          done

      - name: 이슈 양식과 워크플로 YAML 문법
        run: |
          python3 - <<'PY'
          import pathlib, sys
          try:
              import yaml
          except ImportError:
              print("PyYAML 없음 — 건너뜀"); sys.exit(0)
          bad = 0
          for p in sorted(pathlib.Path(".github").rglob("*.yml")):
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8")); print(f"OK: {p}")
              except Exception as e:
                  print(f"::error file={p}::{e}"); bad = 1
          sys.exit(bad)
          PY

      - name: 셸 스크립트 실행 비트 (git 모드 100755)
        run: |
          # 목록을 손으로 적으면 새 스크립트가 조용히 빠진다. 추적되는 .sh 를 전부 본다.
          git ls-files -s '*.sh' | while read -r mode _ _ f; do
            [ "$mode" = "100755" ] || { echo "::error file=$f::git 모드가 $mode 다. 실행되려면 100755 여야 한다. git update-index --chmod=+x $f"; exit 1; }
            echo "OK: $f $mode"
          done

      - name: 훅이 가리키는 파일이 실제로 있고 실행되는가
        run: |
          # hooks.json 에 오타가 나면 플러그인은 조용히 아무것도 하지 않는다.
          # ${CLAUDE_PLUGIN_ROOT} 는 설치본 루트, 곧 이 저장소의 plugin/ 이다.
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path("plugin")
          cfg = json.load(open(root / "hooks" / "hooks.json"))
          bad = []
          seen = 0
          for event, groups in cfg["hooks"].items():
              for g in groups:
                  for h in g["hooks"]:
                      cmd = h["command"].replace("${CLAUDE_PLUGIN_ROOT}/", "")
                      p = root / cmd
                      seen += 1
                      if not p.is_file():
                          bad.append(f"{event}: {p} 가 없다")
                      elif not os.access(p, os.X_OK):
                          bad.append(f"{event}: {p} 에 실행 권한이 없다")
          for b in bad:
              print(f"::error::{b}")
          print(f"훅 핸들러 {seen}개 " + ("확인" if not bad else f"불일치 {len(bad)}건"))
          sys.exit(1 if bad else 0)
          PY

      - name: CODEOWNERS 가 가리키는 경로가 실제로 있는가
        run: |
          # 죽은 경로는 조용히 아무도 리뷰어로 지정하지 않는다. 실제로 /references/ 가 그런 상태였다.
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          seen = 0
          for i, raw in enumerate(pathlib.Path(".github/CODEOWNERS").read_text(encoding="utf-8").splitlines(), 1):
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              pat = line.split()[0]
              if pat == "*":
                  continue
              seen += 1
              # 선행 / 는 저장소 루트 기준이다. 후행 / 는 디렉터리라는 뜻이다.
              target = pathlib.Path(pat.strip("/"))
              if not target.exists():
                  bad.append(f"{i}행: {pat} 가 저장소에 없다")
              elif pat.endswith("/") and not target.is_dir():
                  bad.append(f"{i}행: {pat} 는 디렉터리가 아니다")
          for b in bad:
              print(f"::error file=.github/CODEOWNERS::{b}")
          print(f"CODEOWNERS 경로 {seen}개 — " + ("전부 존재" if not bad else f"죽은 경로 {len(bad)}건"))
          sys.exit(1 if bad else 0)
          PY

      - name: 훅 회귀 테스트
        run: |
          python3 tests/test_posttooluse.py
          python3 tests/test_pretooluse.py

      - name: 내장 윤문 스크립트 컴파일·스모크
        run: |
          python3 -m py_compile plugin/scripts/*.py plugin/skills/humanize-korean/references/*.py
          python3 plugin/scripts/prepare_monolith_input.py --help > /dev/null
          python3 plugin/scripts/verify_gates.py --help > /dev/null

      - name: 한국어 문서가 자기 훅을 통과하는가
        run: |
          # 목록을 손으로 적으면 새 문서가 조용히 빠진다. 실제로 REPORT.md 가 그렇게 빠져 있었다.
          # --all 은 저장소 루트를 기준으로 훑으므로 plugin/ 밖의 문서도 같이 본다.
          plugin/scripts/check.sh --all

      - name: 글자 수 스크립트 스모크
        run: |
          node plugin/skills/korean-character-count/scripts/korean_character_count.js --text "가나다" --format text | grep -q "^characters: 3$"

      - name: 네트워크를 쓰지 않는가
        run: |
          # README·SECURITY.md 가 "원문은 이 컴퓨터를 벗어나지 않는다" 를 약속한다.
          # 약속을 글로만 두면 다음 커밋이 조용히 깬다. 여기서 막는다.
          # 대상은 설치본에 실리는 것, 곧 plugin/ 아래의 실행 파일 전부다.
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          tracked = subprocess.run(
              ["git", "ls-files", "plugin/*.sh", "plugin/*.py", "plugin/*.js"],
              capture_output=True, text=True, check=True).stdout.split()
          if not tracked:
              print("::error::plugin/ 에서 실행 파일을 찾지 못했다. 경로가 바뀌었는지 본다")
              sys.exit(1)

          # 네트워크를 여는 표지. 주석 속 URL 은 세지 않는다.
          MARKERS = re.compile(
              r"\b(urllib|urllib2|urllib3|http\.client|httplib|requests\.(get|post|put|delete|request)"
              r"|socket\.(socket|create_connection)|ssl\.wrap_socket|smtplib|ftplib|telnetlib|xmlrpc"
              r"|fetch\s*\(|XMLHttpRequest|WebSocket|require\s*\(\s*['\"](http|https|net|dgram|tls)['\"]\s*\)"
              r"|\bcurl\b|\bwget\b|\bnc\b\s+-|\bssh\b|\bscp\b|\brsync\b)"
          )
          bad = []
          for f in tracked:
              for i, line in enumerate(pathlib.Path(f).read_text(encoding="utf-8").splitlines(), 1):
                  code = re.sub(r"(#|//).*$", "", line)
                  m = MARKERS.search(code)
                  if m:
                      bad.append((f, i, m.group(0), line.strip()[:80]))
          for f, i, tok, line in bad:
              print(f"::error file={f},line={i}::네트워크 표지 '{tok}': {line}")
          print(f"설치본에 실리는 실행 파일 {len(tracked)}개 — " +
                ("네트워크 표지 없음" if not bad else f"표지 {len(bad)}건"))
          sys.exit(1 if bad else 0)
          PY

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          git ls-files '*.sh' | xargs shellcheck

  workflows:
    # 워크플로 자체를 검사한다. 여기서 새는 것은 저장소 전체가 새는 것이다.
    # actionlint 는 문법과 표현식을, zizmor 는 공급망 관점의 위험을 본다.
    name: 워크플로 린트
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor 결과를 Security 탭에 올린다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # 액션의 기본값은 latest 다. 고정하지 않으면 어느 날 새 규칙이 생겨
          # 건드리지 않은 PR 이 빨갛게 된다. 올릴 때는 손으로 올리고 그 PR 에서 본다.
          version: "1.30.1"
          persona: regular
          advanced-security: true

  version:
    # 버전의 정본은 plugin/.claude-plugin/plugin.json 이다.
    # README 배지·CHANGELOG·SECURITY.md·마켓플레이스가 따라오지 않으면 막는다.
    name: 버전 표기 일치
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          ver = json.load(open("plugin/.claude-plugin/plugin.json"))["version"]
          bad = []
          for p in ("README.md", "README.en.md"):
              s = pathlib.Path(p).read_text(encoding="utf-8")
              m = re.search(r"badge/version-([^-]+)-lightgrey", s)
              if not m:
                  bad.append(f"{p}: version 배지를 찾지 못했다")
              elif m.group(1) != ver:
                  bad.append(f"{p}: 배지 {m.group(1)} != plugin.json {ver}")
          mk = json.load(open(".claude-plugin/marketplace.json"))
          for label, got in (("marketplace", mk.get("version")),
                             ("marketplace plugins[0]", mk["plugins"][0].get("version"))):
              if got != ver:
                  bad.append(f"{label}: {got} != plugin.json {ver}")
          s = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## \[{re.escape(ver)}\]", s, re.M):
              bad.append(f"CHANGELOG.md: [{ver}] 절이 없다")
          # 지원 버전 표가 낡으면 취약점 신고자가 잘못된 판을 본다.
          minor = ".".join(ver.split(".")[:2]) + ".x"
          sec = pathlib.Path("SECURITY.md").read_text(encoding="utf-8")
          # 칸 끝까지 묶는다. `| 지원` 만 보면 `| 지원하지 않음` 이 통과한다(실측으로 확인).
          for label in ("지원", "Supported"):
              if not re.search(rf"^\|\s*{re.escape(minor)}\s*\|\s*{re.escape(label)}\s*\|", sec, re.M):
                  bad.append(f"SECURITY.md: {minor} 를 지원한다는 줄이 없다 ({label})")
          for b in bad:
              print(f"::error::{b}")
          print(f"plugin.json 버전 {ver} — " + (f"불일치 {len(bad)}건" if bad else "배지·마켓플레이스·CHANGELOG·SECURITY 와 일치"))
          sys.exit(1 if bad else 0)
          PY

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Claude Code CLI 설치
        # 잠금 파일에서 받는다. 받는 tarball 의 sha512 까지 고정돼 있고
        # 올리는 것은 Dependabot 이 PR 로 가져온다(zizmor adhoc-packages).
        run: npm ci --prefix .github/tools --no-audit --no-fund
      - name: validate --strict
        # grep "Validation passed" 는 "Validation passed with warnings" 에도 걸려
        # 오타 필드가 초록으로 지나간다(실측: licence 를 넣어도 통과). --strict 는 exit 1 이다.
        # 저장소 루트를 주면 마켓플레이스를 읽고 거기서 plugin/ 을 따라 들어간다.
        run: .github/tools/node_modules/.bin/claude plugin validate . --strict
      - name: 설치본만 따로 검증
        # 사용자에게 실제로 복사되는 것은 plugin/ 뿐이다. 그것만 떼어 놓고도 유효해야 한다.
        run: .github/tools/node_modules/.bin/claude plugin validate ./plugin --strict
